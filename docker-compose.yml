version: "3.8"

services:
  # ── API Application Server ──
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: defect-detection-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_DIR=/app/logs
      - UPLOAD_DIR=/app/backend/uploads
      - API_KEY=$API_KEY
      - DEBUG=$DEBUG
      - MODEL_PATH=$MODEL_PATH
      - INFERENCE_CONFIDENCE_THRESHOLD=$INFERENCE_CONFIDENCE_THRESHOLD
      - INFERENCE_IOU_THRESHOLD=$INFERENCE_IOU_THRESHOLD
    volumes:
      - api-logs:/app/logs
      - api-uploads:/app/backend/uploads
      - ./models:/app/models
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Prometheus Server (Monitoring) ──
  prometheus:
    image: prom/prometheus:latest
    container_name: defect-detection-prometheus
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy

  # ── Grafana Dashboard ──
  grafana:
    image: grafana/grafana:latest
    container_name: defect-detection-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      prometheus:
        condition: service_started

volumes:
  api-logs:
  api-uploads:
