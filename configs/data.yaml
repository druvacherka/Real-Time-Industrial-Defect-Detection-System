# YOLOv8 Dataset Configuration for NEU Metal Surface Defects
path: ../dataset/yolo  # dataset root dir (relative to training execution path)
train: images/train  # train images (relative to path)
val: images/val      # val images (relative to path)
test: images/test    # test images (relative to path, optional)

# Classes
names:
  0: crazing
  1: inclusion
  2: patches
  3: pitted_surface
  4: rolled_in_scale
  5: scratches
