# YOLOv8 Dataset Configuration — NEU Metal Surface Defects
# Updated: 2026-07-07  fix: class name rolled_in_scale -> rolled-in_scale

path: dataset/yolo  # dataset root dir (relative to training execution path)
train: images/train    # train images (relative to path)
val:   images/val      # val images   (relative to path)
test:  images/test     # test images  (relative to path, optional)

# Number of classes
nc: 6

# Class names — must match YOLO label file class IDs 0-5
names:
  0: crazing
  1: inclusion
  2: patches
  3: pitted_surface
  4: rolled-in_scale
  5: scratches
