# Preprocessing Pipeline Configurations

# Target resizing configuration
resize:
  width: 200
  height: 200
  interpolation: "bilinear" # Options: nearest, bilinear, bicubic, area

# Normalization configuration
normalization:
  enabled: true
  type: "standard" # Options: min_max, standard (z-score)
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# Augmentation pipeline integration
augmentation:
  enabled: false
  min_visibility: 0.3

# Output configuration
output:
  format: ".png" # Options: .png, .jpg, .npy
  jpeg_quality: 95
